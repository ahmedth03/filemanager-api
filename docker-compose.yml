services:

  postgres:
    image: postgres:16-alpine
    container_name: harfidar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: harfidar_db
      POSTGRES_USER: harfidar
      POSTGRES_PASSWORD: harfidar_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harfidar -d harfidar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harfidar-redis
    restart: unless-stopped
    command: redis-server --requirepass harfidar_redis_pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "harfidar_redis_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harfidar-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
