version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: harfidar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harfidar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harfidar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-harfidar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harfidar} -d ${POSTGRES_DB:-harfidar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harfidar_network

  redis:
    image: redis:7-alpine
    container_name: harfidar_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harfidar_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: harfidar_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-harfidar}:${POSTGRES_PASSWORD:-harfidar_secret}@postgres:5432/${POSTGRES_DB:-harfidar_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:dev"]
    networks:
      - harfidar_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: harfidar_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@harfidar.dz}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - harfidar_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  harfidar_network:
    driver: bridge
